<!DOCTYPE html>
<html>
<head>
    <title>Product Listing Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: #b4f8f7;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        #products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            background-color: rgb(212, 186, 207);
            width: 220px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgb(16, 16, 16);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
        }

        .api {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Product Listing Page</h1>

    <div class="api"></div>

    <div id="products"></div>

    <script src="api.js"></script>

</body>
</html>
